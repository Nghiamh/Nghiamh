<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 135" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2530" />
      <stop offset="100%" stop-color="#071b24" />
    </linearGradient>

    <linearGradient id="waveLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BFA7" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#A8E6CF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BFA7" stop-opacity="0.1" />
    </linearGradient>

    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes waveSlide {
        0% { transform: translateX(0); }
        50% { transform: translateX(-30px); }
        100% { transform: translateX(0); }
      }
      .cursor {
        animation: blink 1s infinite;
      }
      .wave {
        animation: waveSlide 12s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="135" rx="10" fill="url(#oceanBg)" stroke="#174D63" stroke-width="1.2" />

  <!-- Top bar -->
  <path d="M0,10 C0,4.47 4.47,0 10,0 L870,0 C875.53,0 880,4.47 880,10 L880,32 L0,32 Z" fill="#06161e" />
  <line x1="0" y1="32" x2="880" y2="32" stroke="#174D63" stroke-width="1" />

  <!-- Window dots -->
  <circle cx="22" cy="16" r="5" fill="#174D63" />
  <circle cx="38" cy="16" r="5" fill="#38BFA7" />
  <circle cx="54" cy="16" r="5" fill="#A8E6CF" />

  <text x="440" y="20" text-anchor="middle" class="mono" font-size="12" fill="#38BFA7" opacity="0.85">
    ocean@nghiamh: ~
  </text>

  <!-- Animated wave light at bottom -->
  <path class="wave" d="M-50,118 Q180,105 440,118 T930,112 T1400,120" fill="none" stroke="url(#waveLine)" stroke-width="1.6" />

  <!-- Terminal text -->
  <text x="24" y="64" class="mono" font-size="14" font-weight="600" fill="#38BFA7">
    ocean@developer:~$ <tspan fill="#A8E6CF" font-weight="500">whoami</tspan>
  </text>

  <text x="24" y="96" class="mono" font-size="14" fill="#A8E6CF">
    Minh Nghĩa (Nghiamh) <tspan fill="#174D63">|</tspan> <tspan fill="#38BFA7">Mobile &amp; Web Developer</tspan>
  </text>
  <rect class="cursor" x="425" y="83" width="8" height="15" fill="#38BFA7" />
</svg>
