<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="100%" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');

      .font-sans {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      }

      /* Subtle pulse on status dot */
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.15); }
      }
      .pulse-dot {
        animation: pulse 2.2s ease-in-out infinite;
        transform-origin: center;
      }

      /* Subtle gradient hover shift */
      @keyframes waveGlow {
        0%, 100% { stop-color: #38BFA7; stop-opacity: 0.12; }
        50% { stop-color: #A8E6CF; stop-opacity: 0.22; }
      }
    </style>

    <!-- Deep Ocean Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2F3D" />
      <stop offset="100%" stop-color="#081E27" />
    </linearGradient>

    <linearGradient id="heroCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#113849" />
      <stop offset="100%" stop-color="#09212B" />
    </linearGradient>

    <!-- Daisy Flower Definition -->
    <g id="daisyFlower">
      <ellipse cx="0" cy="-7" rx="2.8" ry="6.5" fill="#FFFFFF" opacity="0.95" />
      <ellipse cx="0" cy="7" rx="2.8" ry="6.5" fill="#FFFFFF" opacity="0.95" />
      <ellipse cx="-7" cy="0" rx="6.5" ry="2.8" fill="#FFFFFF" opacity="0.95" />
      <ellipse cx="7" cy="0" rx="6.5" ry="2.8" fill="#FFFFFF" opacity="0.95" />
      <ellipse cx="-5" cy="-5" rx="2.8" ry="6.5" transform="rotate(-45 -5 -5)" fill="#FFFFFF" opacity="0.9" />
      <ellipse cx="5" cy="-5" rx="2.8" ry="6.5" transform="rotate(45 5 -5)" fill="#FFFFFF" opacity="0.9" />
      <ellipse cx="-5" cy="5" rx="2.8" ry="6.5" transform="rotate(45 -5 5)" fill="#FFFFFF" opacity="0.9" />
      <ellipse cx="5" cy="5" rx="2.8" ry="6.5" transform="rotate(-45 5 5)" fill="#FFFFFF" opacity="0.9" />
      <circle cx="0" cy="0" r="3.8" fill="#FBBF24" />
    </g>
  </defs>

  <!-- ==================== BOX 1: HERO IDENTITY (TOP LEFT) ==================== -->
  <g transform="translate(0, 0)">
    <rect width="508" height="165" rx="14" fill="url(#heroCardBg)" stroke="#174D63" stroke-width="1.2" />
    
    <!-- Decorative background wave curve -->
    <path d="M0,120 Q180,90 350,135 T508,110 L508,165 L0,165 Z" fill="#38BFA7" fill-opacity="0.04" />

    <!-- Daisy Accent Icon -->
    <g transform="translate(468, 38)">
      <use href="#daisyFlower" transform="scale(1.2)" />
    </g>

    <!-- Tag pill -->
    <rect x="24" y="22" width="100" height="22" rx="11" fill="#174D63" fill-opacity="0.6" stroke="#38BFA7" stroke-width="0.8" />
    <text x="74" y="37" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#38BFA7">@Nghiamh</text>

    <!-- Name & Title -->
    <text x="24" y="80" class="font-sans" font-size="25" font-weight="800" fill="#E6F7F0" letter-spacing="-0.3">
      HỒ MINH NGHĨA
    </text>
    <text x="24" y="106" class="font-mono" font-size="13" font-weight="600" fill="#38BFA7">
      Mobile &amp; Fullstack Web Engineer
    </text>

    <!-- Subtitle / Motto -->
    <text x="24" y="138" class="font-mono" font-size="11.5" fill="#8ECBB5">
      Focus on clean architecture, fluid mobile UX &amp; resilient backend systems.
    </text>
  </g>

  <!-- ==================== BOX 2: STATUS & AVAILABILITY (TOP RIGHT) ==================== -->
  <g transform="translate(520, 0)">
    <rect width="300" height="165" rx="14" fill="url(#cardBg)" stroke="#174D63" stroke-width="1.2" />

    <!-- Header label -->
    <text x="22" y="32" class="font-mono" font-size="11" font-weight="700" fill="#38BFA7" letter-spacing="1">
      AVAILABILITY &amp; BIO
    </text>

    <!-- Status Badge -->
    <g transform="translate(22, 46)">
      <rect width="256" height="32" rx="8" fill="#0B2530" stroke="#38BFA7" stroke-width="0.8" />
      <circle cx="16" cy="16" r="4.5" fill="#38BFA7" class="pulse-dot" />
      <text x="32" y="21" class="font-mono" font-size="11" font-weight="600" fill="#A8E6CF">
        OPEN FOR OPPORTUNITIES
      </text>
    </g>

    <text x="22" y="106" class="font-mono" font-size="11.5" fill="#52a7b8">Target:</text>
    <text x="78" y="106" class="font-mono" font-size="11.5" font-weight="600" fill="#E6F7F0">Fresher / Intern Developer</text>

    <text x="22" y="132" class="font-mono" font-size="11.5" fill="#52a7b8">Origin:</text>
    <text x="78" y="132" class="font-mono" font-size="11.5" fill="#A8E6CF">Vietnam 🇻🇳 · 2003 (Quý Mùi 🌿)</text>
  </g>

  <!-- ==================== BOX 3: PRIMARY TECH PILLS (BOTTOM LEFT) ==================== -->
  <g transform="translate(0, 177)">
    <rect width="508" height="123" rx="14" fill="url(#cardBg)" stroke="#174D63" stroke-width="1.2" />

    <text x="24" y="28" class="font-mono" font-size="11" font-weight="700" fill="#38BFA7" letter-spacing="1">
      CORE TECH STACK
    </text>

    <!-- Row 1 of pills -->
    <g transform="translate(24, 42)">
      <!-- React Native -->
      <rect x="0" y="0" width="108" height="26" rx="6" fill="#0B2530" stroke="#174D63" />
      <text x="54" y="17" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#A8E6CF">React Native</text>

      <!-- Expo -->
      <rect x="116" y="0" width="58" height="26" rx="6" fill="#0B2530" stroke="#174D63" />
      <text x="145" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#A8E6CF">Expo</text>

      <!-- React.js -->
      <rect x="182" y="0" width="76" height="26" rx="6" fill="#0B2530" stroke="#174D63" />
      <text x="220" y="17" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#A8E6CF">React.js</text>

      <!-- TypeScript -->
      <rect x="266" y="0" width="90" height="26" rx="6" fill="#0B2530" stroke="#38BFA7" stroke-width="0.8" />
      <text x="311" y="17" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#38BFA7">TypeScript</text>

      <!-- Node.js -->
      <rect x="364" y="0" width="84" height="26" rx="6" fill="#0B2530" stroke="#174D63" />
      <text x="406" y="17" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#A8E6CF">Node.js</text>
    </g>

    <!-- Row 2 of pills -->
    <g transform="translate(24, 76)">
      <!-- Express.js -->
      <rect x="0" y="0" width="88" height="26" rx="6" fill="#0B2530" stroke="#174D63" />
      <text x="44" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#A8E6CF">Express.js</text>

      <!-- MySQL -->
      <rect x="96" y="0" width="65" height="26" rx="6" fill="#0B2530" stroke="#174D63" />
      <text x="128" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#A8E6CF">MySQL</text>

      <!-- SignalR / WebSockets -->
      <rect x="169" y="0" width="74" height="26" rx="6" fill="#0B2530" stroke="#174D63" />
      <text x="206" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#A8E6CF">SignalR</text>

      <!-- TailwindCSS -->
      <rect x="251" y="0" width="98" height="26" rx="6" fill="#0B2530" stroke="#174D63" />
      <text x="300" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#A8E6CF">TailwindCSS</text>

      <!-- Git / Postman -->
      <rect x="357" y="0" width="98" height="26" rx="6" fill="#0B2530" stroke="#174D63" />
      <text x="406" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#A8E6CF">Git &amp; Postman</text>
    </g>
  </g>

  <!-- ==================== BOX 4: ARCHITECTURE HIGHLIGHTS (BOTTOM RIGHT) ==================== -->
  <g transform="translate(520, 177)">
    <rect width="300" height="123" rx="14" fill="url(#cardBg)" stroke="#174D63" stroke-width="1.2" />

    <text x="22" y="28" class="font-mono" font-size="11" font-weight="700" fill="#38BFA7" letter-spacing="1">
      ENGINEERING FOCUS
    </text>

    <text x="22" y="55" class="font-mono" font-size="11.5" fill="#38BFA7">❖</text>
    <text x="40" y="55" class="font-mono" font-size="11.5" fill="#A8E6CF">Cross-Platform Mobile Apps</text>

    <text x="22" y="80" class="font-mono" font-size="11.5" fill="#38BFA7">❖</text>
    <text x="40" y="80" class="font-mono" font-size="11.5" fill="#A8E6CF">Full-Stack Monorepo Systems</text>

    <text x="22" y="105" class="font-mono" font-size="11.5" fill="#38BFA7">❖</text>
    <text x="40" y="105" class="font-mono" font-size="11.5" fill="#A8E6CF">Real-Time WebSockets &amp; GIS</text>
  </g>
</svg>
