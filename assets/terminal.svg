<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="100%" height="270">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');

      text {
        font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        user-select: none;
      }

      /* Tab Switch Animation: 21s total (7s per tab) */
      @keyframes tab1Anim {
        0%, 28.5% { opacity: 1; visibility: visible; }
        33.3%, 95.2% { opacity: 0; visibility: hidden; }
        100% { opacity: 1; visibility: visible; }
      }
      @keyframes tab2Anim {
        0%, 28.5% { opacity: 0; visibility: hidden; }
        33.3%, 61.9% { opacity: 1; visibility: visible; }
        66.6%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes tab3Anim {
        0%, 61.9% { opacity: 0; visibility: hidden; }
        66.6%, 95.2% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }

      .tab-view-1 { animation: tab1Anim 21s ease-in-out infinite; }
      .tab-view-2 { animation: tab2Anim 21s ease-in-out infinite; }
      .tab-view-3 { animation: tab3Anim 21s ease-in-out infinite; }

      /* Syntax Highlighting */
      .ln       { fill: #205970; font-size: 11.5px; }
      .kw       { fill: #38BFA7; font-weight: 600; font-size: 12.5px; }
      .var-name { fill: #A8E6CF; font-size: 12.5px; }
      .str      { fill: #9fe2cb; font-size: 12.5px; }
      .str-hi   { fill: #FBBF24; font-size: 12.5px; font-weight: 500; }
      .prop     { fill: #52a7b8; font-size: 12.5px; }
      .comment  { fill: #2e6d85; font-size: 11.5px; font-style: italic; }
      .punct    { fill: #38BFA7; font-size: 12.5px; }

      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; fill: #38BFA7; }
    </style>

    <!-- Daisy Accent Icon -->
    <g id="daisy">
      <ellipse cx="0" cy="-5" rx="2" ry="4.5" fill="#FFFFFF" opacity="0.95" />
      <ellipse cx="0" cy="5" rx="2" ry="4.5" fill="#FFFFFF" opacity="0.95" />
      <ellipse cx="-5" cy="0" rx="4.5" ry="2" fill="#FFFFFF" opacity="0.95" />
      <ellipse cx="5" cy="0" rx="4.5" ry="2" fill="#FFFFFF" opacity="0.95" />
      <ellipse cx="-3.5" cy="-3.5" rx="2" ry="4.5" transform="rotate(-45 -3.5 -3.5)" fill="#FFFFFF" opacity="0.9" />
      <ellipse cx="3.5" cy="-3.5" rx="2" ry="4.5" transform="rotate(45 3.5 -3.5)" fill="#FFFFFF" opacity="0.9" />
      <ellipse cx="-3.5" cy="3.5" rx="2" ry="4.5" transform="rotate(45 -3.5 3.5)" fill="#FFFFFF" opacity="0.9" />
      <ellipse cx="3.5" cy="3.5" rx="2" ry="4.5" transform="rotate(-45 3.5 3.5)" fill="#FFFFFF" opacity="0.9" />
      <circle cx="0" cy="0" r="2.8" fill="#FBBF24" />
    </g>
  </defs>

  <!-- Studio Frame Background -->
  <rect width="820" height="270" rx="10" fill="#0B2530" stroke="#174D63" stroke-width="1.2" />

  <!-- Tab Bar Header -->
  <path d="M0,10 C0,4.47 4.47,0 10,0 L810,0 C815.53,0 820,4.47 820,10 L820,34 L0,34 Z" fill="#061720" />
  <line x1="0" y1="34" x2="820" y2="34" stroke="#174D63" stroke-width="1" />

  <!-- Window Control Pills -->
  <circle cx="20" cy="17" r="4.5" fill="#174D63" />
  <circle cx="36" cy="17" r="4.5" fill="#38BFA7" />
  <circle cx="52" cy="17" r="4.5" fill="#A8E6CF" />

  <!-- Tab 1: profile.ts -->
  <g class="tab-view-1">
    <rect x="75" y="6" width="130" height="28" rx="5" fill="#0B2530" stroke="#174D63" stroke-width="0.8" />
    <text x="140" y="24" text-anchor="middle" font-size="11.5" fill="#A8E6CF" font-weight="600">🌿 profile.ts</text>
  </g>
  <g class="tab-view-2">
    <text x="140" y="24" text-anchor="middle" font-size="11.5" fill="#336a7e">profile.ts</text>
  </g>
  <g class="tab-view-3">
    <text x="140" y="24" text-anchor="middle" font-size="11.5" fill="#336a7e">profile.ts</text>
  </g>

  <!-- Tab 2: stack.json -->
  <g class="tab-view-2">
    <rect x="215" y="6" width="130" height="28" rx="5" fill="#0B2530" stroke="#174D63" stroke-width="0.8" />
    <text x="280" y="24" text-anchor="middle" font-size="11.5" fill="#38BFA7" font-weight="600">🛠️ stack.json</text>
  </g>
  <g class="tab-view-1">
    <text x="280" y="24" text-anchor="middle" font-size="11.5" fill="#336a7e">stack.json</text>
  </g>
  <g class="tab-view-3">
    <text x="280" y="24" text-anchor="middle" font-size="11.5" fill="#336a7e">stack.json</text>
  </g>

  <!-- Tab 3: projects.md -->
  <g class="tab-view-3">
    <rect x="355" y="6" width="135" height="28" rx="5" fill="#0B2530" stroke="#174D63" stroke-width="0.8" />
    <text x="422" y="24" text-anchor="middle" font-size="11.5" fill="#A8E6CF" font-weight="600">🚀 projects.md</text>
  </g>
  <g class="tab-view-1">
    <text x="422" y="24" text-anchor="middle" font-size="11.5" fill="#336a7e">projects.md</text>
  </g>
  <g class="tab-view-2">
    <text x="422" y="24" text-anchor="middle" font-size="11.5" fill="#336a7e">projects.md</text>
  </g>

  <!-- Header Right Indicator -->
  <g transform="translate(785, 17)">
    <use href="#daisy" />
  </g>
  <text x="768" y="21" text-anchor="end" font-size="11" fill="#38BFA7" letter-spacing="0.5">nghiamh.dev</text>

  <!-- ==================== TAB 1: PROFILE.TS ==================== -->
  <g class="tab-view-1" transform="translate(18, 54)">
    <text y="14"><tspan x="0" class="ln">01</tspan> <tspan x="32" class="kw">export const</tspan> <tspan class="var-name">developer</tspan> <tspan class="punct">=</tspan> <tspan class="punct">{</tspan></text>
    <text y="36"><tspan x="0" class="ln">02</tspan> <tspan x="50" class="prop">name:</tspan> <tspan class="str">"Hồ Minh Nghĩa"</tspan><tspan class="punct">,</tspan> <tspan class="comment">// (Nghiamh)</tspan></text>
    <text y="58"><tspan x="0" class="ln">03</tspan> <tspan x="50" class="prop">title:</tspan> <tspan class="str-hi">"Mobile &amp; Fullstack Web Engineer"</tspan><tspan class="punct">,</tspan></text>
    <text y="80"><tspan x="0" class="ln">04</tspan> <tspan x="50" class="prop">passions:</tspan> <tspan class="punct">[</tspan><tspan class="str">"React Native"</tspan><tspan class="punct">, </tspan><tspan class="str">"React.js"</tspan><tspan class="punct">, </tspan><tspan class="str">"Node.js"</tspan><tspan class="punct">, </tspan><tspan class="str">"TypeScript"</tspan><tspan class="punct">],</tspan></text>
    <text y="102"><tspan x="0" class="ln">05</tspan> <tspan x="50" class="prop">status:</tspan> <tspan class="str">"Open for Fresher &amp; Internship opportunities"</tspan><tspan class="punct">,</tspan></text>
    <text y="124"><tspan x="0" class="ln">06</tspan> <tspan x="50" class="prop">philosophy:</tspan> <tspan class="str">"Clean code, fluid UX, and resilient architecture."</tspan></text>
    <text y="146"><tspan x="0" class="ln">07</tspan> <tspan x="32" class="punct">};</tspan> <rect class="cursor" x="55" y="134" width="7" height="15" /></text>
    <text y="168"><tspan x="0" class="ln">08</tspan> <tspan x="32" class="comment">// 🌼 Yang Willow Wood · Thủy dưỡng Mộc</tspan></text>
  </g>

  <!-- ==================== TAB 2: STACK.JSON ==================== -->
  <g class="tab-view-2" transform="translate(18, 54)">
    <text y="14"><tspan x="0" class="ln">01</tspan> <tspan x="32" class="punct">{</tspan></text>
    <text y="36"><tspan x="0" class="ln">02</tspan> <tspan x="50" class="prop">"mobile":</tspan> <tspan class="str">"React Native, Expo, Redux Toolkit, NativeWind"</tspan><tspan class="punct">,</tspan></text>
    <text y="58"><tspan x="0" class="ln">03</tspan> <tspan x="50" class="prop">"webFrontend":</tspan> <tspan class="str">"React.js 19, TypeScript, TailwindCSS, Vite"</tspan><tspan class="punct">,</tspan></text>
    <text y="80"><tspan x="0" class="ln">04</tspan> <tspan x="50" class="prop">"backend":</tspan> <tspan class="str">"Node.js, Express.js, RESTful APIs, SignalR"</tspan><tspan class="punct">,</tspan></text>
    <text y="102"><tspan x="0" class="ln">05</tspan> <tspan x="50" class="prop">"databases":</tspan> <tspan class="str">"MySQL, MongoDB"</tspan><tspan class="punct">,</tspan></text>
    <text y="124"><tspan x="0" class="ln">06</tspan> <tspan x="50" class="prop">"devTools":</tspan> <tspan class="str">"Git, GitHub, Postman, VS Code"</tspan></text>
    <text y="146"><tspan x="0" class="ln">07</tspan> <tspan x="32" class="punct">}</tspan> <rect class="cursor" x="48" y="134" width="7" height="15" /></text>
  </g>

  <!-- ==================== TAB 3: PROJECTS.MD ==================== -->
  <g class="tab-view-3" transform="translate(18, 54)">
    <text y="14"><tspan x="0" class="ln">01</tspan> <tspan x="32" class="kw"># Featured Works</tspan></text>
    <text y="38"><tspan x="0" class="ln">02</tspan> <tspan x="32" class="str-hi">▶ ArenaS-Platform</tspan> <tspan class="comment">── Full-stack Sports Arena Ecosystem</tspan></text>
    <text y="58"><tspan x="0" class="ln">03</tspan> <tspan x="54" class="var-name">└─ Monorepo: Node.js (BE) + React.js (FE) + React Native (Mobile)</tspan></text>
    <text y="82"><tspan x="0" class="ln">04</tspan> <tspan x="32" class="str-hi">▶ Emergency-Dispatch</tspan> <tspan class="comment">── Real-time Fleet Coordination System</tspan></text>
    <text y="102"><tspan x="0" class="ln">05</tspan> <tspan x="54" class="var-name">└─ Live Tracking: React 19 + TypeScript + SignalR + Mapbox GL</tspan></text>
    <text y="126"><tspan x="0" class="ln">06</tspan> <tspan x="32" class="comment">Ready to deploy and contribute to high-impact products 🌼</tspan></text>
    <text y="148"><tspan x="0" class="ln">07</tspan> <tspan x="32" class="punct">$ git status: clean</tspan> <rect class="cursor" x="180" y="136" width="7" height="15" /></text>
  </g>

  <!-- Bottom Modern Statusline -->
  <line x1="0" y1="240" x2="820" y2="240" stroke="#174D63" stroke-width="1" />
  
  <!-- Mode badge -->
  <rect x="0" y="241" width="75" height="28" rx="4" fill="#38BFA7" />
  <text x="37" y="259" text-anchor="middle" font-size="11" font-weight="700" fill="#0B2530">DEV</text>

  <!-- Statusline items -->
  <text x="88" y="259" font-size="11" fill="#A8E6CF">⎇ main <tspan fill="#174D63">│</tspan> utf-8 <tspan fill="#174D63">│</tspan> <tspan fill="#38BFA7">nghiamh/workspace</tspan></text>

  <!-- Right statusline items -->
  <text x="806" y="259" text-anchor="end" font-size="11" fill="#4d899e">
    <tspan fill="#38BFA7">200 OK</tspan> <tspan fill="#174D63">│</tspan> TypeScript <tspan fill="#174D63">│</tspan> 🌼 2003
  </text>
</svg>
