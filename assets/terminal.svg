<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 248" width="100%" height="248">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      
      text {
        font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        user-select: none;
      }
      
      /* Slide Transitions: 21s total (7s per slide) */
      @keyframes s1 {
        0%, 28.5% { opacity: 1; visibility: visible; }
        33.3%, 95.2% { opacity: 0; visibility: hidden; }
        100% { opacity: 1; visibility: visible; }
      }
      @keyframes s2 {
        0%, 28.5% { opacity: 0; visibility: hidden; }
        33.3%, 61.9% { opacity: 1; visibility: visible; }
        66.6%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes s3 {
        0%, 61.9% { opacity: 0; visibility: hidden; }
        66.6%, 95.2% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      
      .slide-1 { animation: s1 21s ease-in-out infinite; }
      .slide-2 { animation: s2 21s ease-in-out infinite; }
      .slide-3 { animation: s3 21s ease-in-out infinite; }
      
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; }
      
      /* Terminal Typography */
      .prompt-user { fill: #38BFA7; font-weight: 600; font-size: 13px; }
      .cmd         { fill: #A8E6CF; font-size: 13px; font-weight: 500; }
      .key         { fill: #174D63; font-size: 12px; font-weight: 500; }
      .val         { fill: #A8E6CF; font-size: 12px; }
      .val-bold    { fill: #38BFA7; font-size: 12px; font-weight: 600; }
      .val-dim     { fill: #8ecbb5; font-size: 12px; }
      .meta        { fill: #48788a; font-size: 11px; }
      .status-ok   { fill: #38BFA7; font-size: 11px; font-weight: 600; }
    </style>

    <!-- Subtle Daisy Flower Icon definition -->
    <g id="daisyIcon">
      <ellipse cx="0" cy="-6" rx="2.5" ry="5.5" fill="#FFFFFF" opacity="0.9" />
      <ellipse cx="0" cy="6" rx="2.5" ry="5.5" fill="#FFFFFF" opacity="0.9" />
      <ellipse cx="-6" cy="0" rx="5.5" ry="2.5" fill="#FFFFFF" opacity="0.9" />
      <ellipse cx="6" cy="0" rx="5.5" ry="2.5" fill="#FFFFFF" opacity="0.9" />
      <ellipse cx="-4.2" cy="-4.2" rx="2.5" ry="5.5" transform="rotate(-45 -4.2 -4.2)" fill="#FFFFFF" opacity="0.85" />
      <ellipse cx="4.2" cy="-4.2" rx="2.5" ry="5.5" transform="rotate(45 4.2 -4.2)" fill="#FFFFFF" opacity="0.85" />
      <ellipse cx="-4.2" cy="4.2" rx="2.5" ry="5.5" transform="rotate(45 -4.2 4.2)" fill="#FFFFFF" opacity="0.85" />
      <ellipse cx="4.2" cy="4.2" rx="2.5" ry="5.5" transform="rotate(-45 4.2 4.2)" fill="#FFFFFF" opacity="0.85" />
      <circle cx="0" cy="0" r="3.2" fill="#FBBF24" />
    </g>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="800" height="248" rx="10" fill="#0B2530" stroke="#174D63" stroke-width="1.2"/>

  <!-- Title Bar -->
  <rect width="800" height="32" rx="10" fill="#061720"/>
  <rect y="22" width="800" height="10" fill="#061720"/>
  <line x1="0" y1="32" x2="800" y2="32" stroke="#174D63" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="20" cy="16" r="4.5" fill="#ff5f56"/>
  <circle cx="35" cy="16" r="4.5" fill="#ffbd2e"/>
  <circle cx="50" cy="16" r="4.5" fill="#27c93f"/>

  <!-- Window Header with Daisy Accent -->
  <g transform="translate(325, 16)">
    <use href="#daisyIcon" transform="scale(0.85)" />
    <text x="14" y="4" class="meta" letter-spacing="1">nghiamh@workstation:~</text>
  </g>

  <!-- Slide Indicators -->
  <g class="slide-1"><text x="780" y="20" class="meta" text-anchor="end">[ 1 / 3 ]</text></g>
  <g class="slide-2"><text x="780" y="20" class="meta" text-anchor="end">[ 2 / 3 ]</text></g>
  <g class="slide-3"><text x="780" y="20" class="meta" text-anchor="end">[ 3 / 3 ]</text></g>

  <!-- ═════════ SLIDE 1: WHOAMI ═════════ -->
  <g class="slide-1">
    <text y="62">
      <tspan x="24" class="prompt-user">nghiamh@workstation:~$</tspan>
      <tspan class="cmd"> whoami</tspan>
      <tspan class="cursor" fill="#38BFA7">_</tspan>
    </text>
    
    <text y="92">
      <tspan x="24" class="key">name</tspan>
      <tspan x="125" class="val-bold">Hồ Minh Nghĩa</tspan>
      <tspan class="meta"> (Nghiamh · Developer)</tspan>
    </text>
    
    <text y="120">
      <tspan x="24" class="key">role</tspan>
      <tspan x="125" class="val">Mobile &amp; Fullstack Web Developer</tspan>
    </text>
    
    <text y="148">
      <tspan x="24" class="key">stack</tspan>
      <tspan x="125" class="val-dim">React Native · Expo · React.js · Node.js · TypeScript · MySQL</tspan>
    </text>
    
    <text y="176">
      <tspan x="24" class="key">motto</tspan>
      <tspan x="125" class="val">"Tập trung tạo dựng sản phẩm mượt mà, tối ưu và bền vững."</tspan>
    </text>
  </g>

  <!-- ═════════ SLIDE 2: PROJECTS ═════════ -->
  <g class="slide-2">
    <text y="62">
      <tspan x="24" class="prompt-user">nghiamh@workstation:~$</tspan>
      <tspan class="cmd"> ls -la ./projects/</tspan>
      <tspan class="cursor" fill="#38BFA7">_</tspan>
    </text>
    
    <text y="96">
      <tspan x="24" class="key">drwxr-xr-x</tspan>
      <tspan x="125" class="val-bold">ArenaS-Platform/</tspan>
      <tspan x="270" class="val-dim">React Native · Expo · React · Node.js · MySQL</tspan>
    </text>
    <text y="118">
      <tspan x="270" class="meta">↳ Sports arena booking &amp; tournament management (Web + Mobile Monorepo)</tspan>
    </text>
    
    <text y="152">
      <tspan x="24" class="key">drwxr-xr-x</tspan>
      <tspan x="125" class="val-bold">Emergency-Dispatch/</tspan>
      <tspan x="270" class="val-dim">React 19 · TypeScript · SignalR · Mapbox GL</tspan>
    </text>
    <text y="174">
      <tspan x="270" class="meta">↳ Real-time fleet dispatch management with live tracking &amp; heatmap</tspan>
    </text>
  </g>

  <!-- ═════════ SLIDE 3: TECH STACK ═════════ -->
  <g class="slide-3">
    <text y="62">
      <tspan x="24" class="prompt-user">nghiamh@workstation:~$</tspan>
      <tspan class="cmd"> cat stack.txt</tspan>
      <tspan class="cursor" fill="#38BFA7">_</tspan>
    </text>
    
    <text y="90">
      <tspan x="24" class="key">languages</tspan>
      <tspan x="125" class="val">JavaScript (ES6+) · TypeScript · HTML5 · CSS3 · SQL</tspan>
    </text>
    
    <text y="114">
      <tspan x="24" class="key">frameworks</tspan>
      <tspan x="125" class="val">React Native · Expo · React.js · Node.js · Express.js</tspan>
    </text>
    
    <text y="138">
      <tspan x="24" class="key">database</tspan>
      <tspan x="125" class="val">MySQL · MongoDB · RESTful APIs · SignalR</tspan>
    </text>
    
    <text y="162">
      <tspan x="24" class="key">tools</tspan>
      <tspan x="125" class="val">Git · GitHub · Postman · VS Code · Vite</tspan>
    </text>

    <text y="186">
      <tspan x="24" class="key">focus</tspan>
      <tspan x="125" class="val-dim">Cross-Platform Mobile Apps · Fullstack Web Architectures</tspan>
    </text>
  </g>

  <!-- Bottom Status Bar -->
  <line x1="0" y1="212" x2="800" y2="212" stroke="#174D63" stroke-width="1"/>
  
  <!-- Left Status -->
  <circle cx="24" cy="229" r="3.5" fill="#38BFA7"/>
  <text x="36" y="232" class="meta">zsh 5.9  <tspan fill="#174D63">|</tspan>  git:(<tspan fill="#A8E6CF">main</tspan>)  <tspan fill="#174D63">|</tspan>  utf-8</text>

  <!-- Right Status with tiny daisy -->
  <g transform="translate(710, 229)">
    <use href="#daisyIcon" transform="scale(0.65)" />
  </g>
  <text x="780" y="232" text-anchor="end">
    <tspan class="status-ok">200 OK</tspan>
    <tspan class="meta">  <tspan fill="#174D63">|</tspan>  cycle: 7s</tspan>
  </text>
</svg>
