<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="100%" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');

      .font-sans {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.15); }
      }
      .pulse-dot {
        animation: pulse 2.4s ease-in-out infinite;
        transform-origin: center;
      }
    </style>

    <!-- Subtle Daisy Flower (Dịu nhẹ, không chói) -->
    <g id="daisyFlower">
      <ellipse cx="0" cy="-6" rx="2.5" ry="5.5" fill="#C8DDD5" opacity="0.9" />
      <ellipse cx="0" cy="6" rx="2.5" ry="5.5" fill="#C8DDD5" opacity="0.9" />
      <ellipse cx="-6" cy="0" rx="5.5" ry="2.5" fill="#C8DDD5" opacity="0.9" />
      <ellipse cx="6" cy="0" rx="5.5" ry="2.5" fill="#C8DDD5" opacity="0.9" />
      <ellipse cx="-4.2" cy="-4.2" rx="2.5" ry="5.5" transform="rotate(-45 -4.2 -4.2)" fill="#C8DDD5" opacity="0.85" />
      <ellipse cx="4.2" cy="-4.2" rx="2.5" ry="5.5" transform="rotate(45 4.2 -4.2)" fill="#C8DDD5" opacity="0.85" />
      <ellipse cx="-4.2" cy="4.2" rx="2.5" ry="5.5" transform="rotate(45 -4.2 4.2)" fill="#C8DDD5" opacity="0.85" />
      <ellipse cx="4.2" cy="4.2" rx="2.5" ry="5.5" transform="rotate(-45 4.2 4.2)" fill="#C8DDD5" opacity="0.85" />
      <circle cx="0" cy="0" r="3.2" fill="#E5A93C" />
    </g>
  </defs>

  <!-- Root Canvas Background (Tối sâu, dịu mắt #0A1215) -->
  <rect width="820" height="300" rx="16" fill="#0A1215" />

  <!-- ==================== BOX 1: HERO IDENTITY (TOP LEFT) ==================== -->
  <g transform="translate(0, 0)">
    <rect width="508" height="165" rx="14" fill="#112026" stroke="#1D363E" stroke-width="1.2" />
    
    <!-- Subtle wave curve -->
    <path d="M0,120 Q180,95 350,135 T508,110 L508,165 L0,165 Z" fill="#5BB59E" fill-opacity="0.03" />

    <!-- Daisy Accent Icon -->
    <g transform="translate(468, 38)">
      <use href="#daisyFlower" transform="scale(1.1)" />
    </g>

    <!-- Tag pill -->
    <rect x="24" y="22" width="102" height="22" rx="11" fill="#0A1215" stroke="#5BB59E" stroke-width="0.8" />
    <text x="75" y="37" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#5BB59E">@Nghiamh</text>

    <!-- Name & Title -->
    <text x="24" y="80" class="font-sans" font-size="25" font-weight="800" fill="#C8DDD5" letter-spacing="-0.3">
      HỒ MINH NGHĨA
    </text>
    <text x="24" y="106" class="font-mono" font-size="13" font-weight="600" fill="#5BB59E">
      Mobile &amp; Fullstack Web Engineer
    </text>

    <!-- Subtitle / Motto -->
    <text x="24" y="138" class="font-mono" font-size="11.5" fill="#7F9E96">
      Focus on clean architecture, fluid mobile UX &amp; resilient backend systems.
    </text>
  </g>

  <!-- ==================== BOX 2: PROFILE & FOCUS (TOP RIGHT) ==================== -->
  <g transform="translate(520, 0)">
    <rect width="300" height="165" rx="14" fill="#112026" stroke="#1D363E" stroke-width="1.2" />

    <!-- Header label -->
    <text x="22" y="32" class="font-mono" font-size="11" font-weight="700" fill="#5BB59E" letter-spacing="1">
      DEVELOPER PROFILE
    </text>

    <!-- Status Badge -->
    <g transform="translate(22, 46)">
      <rect width="256" height="32" rx="8" fill="#0A1215" stroke="#5BB59E" stroke-width="0.8" />
      <circle cx="20" cy="16" r="4.5" fill="#5BB59E" class="pulse-dot" />
      <text x="36" y="20.5" class="font-mono" font-size="11" font-weight="600" fill="#C8DDD5">
        OPEN TO WORK &amp; COLLAB
      </text>
    </g>

    <!-- Dùng tspan chung 1 dòng để chuẩn khoảng trắng, không bao giờ bị dính sát -->
    <text x="22" y="106" class="font-mono" font-size="11.5">
      <tspan fill="#7F9E96">Focus: </tspan>
      <tspan fill="#C8DDD5" font-weight="600">Mobile Apps &amp; Web Systems</tspan>
    </text>

    <text x="22" y="132" class="font-mono" font-size="11.5">
      <tspan fill="#7F9E96">Based in: </tspan>
      <tspan fill="#C8DDD5">Vietnam · 2004</tspan>
    </text>
  </g>

  <!-- ==================== BOX 3: PRIMARY TECH PILLS (BOTTOM LEFT) ==================== -->
  <g transform="translate(0, 177)">
    <rect width="508" height="123" rx="14" fill="#112026" stroke="#1D363E" stroke-width="1.2" />

    <text x="24" y="28" class="font-mono" font-size="11" font-weight="700" fill="#5BB59E" letter-spacing="1">
      CORE TECH STACK
    </text>

    <!-- Row 1 of pills -->
    <g transform="translate(24, 42)">
      <!-- React Native -->
      <rect x="0" y="0" width="108" height="26" rx="6" fill="#0A1215" stroke="#1D363E" />
      <text x="54" y="17" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#C8DDD5">React Native</text>

      <!-- Expo -->
      <rect x="116" y="0" width="58" height="26" rx="6" fill="#0A1215" stroke="#1D363E" />
      <text x="145" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#7F9E96">Expo</text>

      <!-- React.js -->
      <rect x="182" y="0" width="76" height="26" rx="6" fill="#0A1215" stroke="#1D363E" />
      <text x="220" y="17" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#C8DDD5">React.js</text>

      <!-- TypeScript -->
      <rect x="266" y="0" width="90" height="26" rx="6" fill="#0A1215" stroke="#5BB59E" stroke-width="0.8" />
      <text x="311" y="17" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#5BB59E">TypeScript</text>

      <!-- Node.js -->
      <rect x="364" y="0" width="84" height="26" rx="6" fill="#0A1215" stroke="#1D363E" />
      <text x="406" y="17" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#C8DDD5">Node.js</text>
    </g>

    <!-- Row 2 of pills -->
    <g transform="translate(24, 76)">
      <!-- Express.js -->
      <rect x="0" y="0" width="88" height="26" rx="6" fill="#0A1215" stroke="#1D363E" />
      <text x="44" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#7F9E96">Express.js</text>

      <!-- MySQL -->
      <rect x="96" y="0" width="65" height="26" rx="6" fill="#0A1215" stroke="#1D363E" />
      <text x="128" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#7F9E96">MySQL</text>

      <!-- SignalR -->
      <rect x="169" y="0" width="74" height="26" rx="6" fill="#0A1215" stroke="#1D363E" />
      <text x="206" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#7F9E96">SignalR</text>

      <!-- TailwindCSS -->
      <rect x="251" y="0" width="98" height="26" rx="6" fill="#0A1215" stroke="#1D363E" />
      <text x="300" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#7F9E96">TailwindCSS</text>

      <!-- Git / Postman -->
      <rect x="357" y="0" width="98" height="26" rx="6" fill="#0A1215" stroke="#1D363E" />
      <text x="406" y="17" text-anchor="middle" class="font-mono" font-size="11" fill="#7F9E96">Git &amp; Postman</text>
    </g>
  </g>

  <!-- ==================== BOX 4: ARCHITECTURE HIGHLIGHTS (BOTTOM RIGHT) ==================== -->
  <g transform="translate(520, 177)">
    <rect width="300" height="123" rx="14" fill="#112026" stroke="#1D363E" stroke-width="1.2" />

    <text x="22" y="28" class="font-mono" font-size="11" font-weight="700" fill="#5BB59E" letter-spacing="1">
      ENGINEERING FOCUS
    </text>

    <text x="22" y="55" class="font-mono" font-size="11.5" fill="#5BB59E">❖</text>
    <text x="40" y="55" class="font-mono" font-size="11.5" fill="#C8DDD5">Cross-Platform Mobile Apps</text>

    <text x="22" y="80" class="font-mono" font-size="11.5" fill="#5BB59E">❖</text>
    <text x="40" y="80" class="font-mono" font-size="11.5" fill="#C8DDD5">Full-Stack Monorepo Systems</text>

    <text x="22" y="105" class="font-mono" font-size="11.5" fill="#5BB59E">❖</text>
    <text x="40" y="105" class="font-mono" font-size="11.5" fill="#C8DDD5">Real-Time WebSockets &amp; GIS</text>
  </g>
</svg>
