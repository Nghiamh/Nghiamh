<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" width="100%" height="100%">
  <defs>
    <!-- Underwater ambient lighting -->
    <radialGradient id="waterGlow" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#174D63" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0B2530" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#061820" stop-opacity="1" />
    </radialGradient>

    <!-- Gentle wave mask/gradient -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BFA7" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#A8E6CF" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#38BFA7" stop-opacity="0.05" />
    </linearGradient>

    <filter id="aquaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      .title-text {
        font-size: 13px;
        fill: #A8E6CF;
        letter-spacing: 0.5px;
      }
      .prompt {
        font-size: 13.5px;
        font-weight: 600;
        fill: #38BFA7;
      }
      .cmd {
        font-size: 13.5px;
        font-weight: 500;
        fill: #A8E6CF;
      }
      .text-primary {
        font-size: 13px;
        fill: #A8E6CF;
      }
      .text-teal {
        font-size: 13px;
        fill: #38BFA7;
      }
      .text-dim {
        font-size: 13px;
        fill: #174D63;
      }
      .status-text {
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.8px;
      }

      /* Subtle water ripples animation */
      @keyframes waveFlow {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }
      @keyframes waveFlowReverse {
        0% { transform: translateX(0); }
        50% { transform: translateX(35px); }
        100% { transform: translateX(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.65; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes tideBreath {
        0%, 100% { fill: #38BFA7; }
        50% { fill: #A8E6CF; }
      }

      .wave-1 {
        animation: waveFlow 18s ease-in-out infinite;
      }
      .wave-2 {
        animation: waveFlowReverse 14s ease-in-out infinite;
      }
      .ambient-pulse {
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .cursor {
        animation: cursorBlink 1.1s infinite;
      }
      .tide-indicator {
        animation: tideBreath 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="0" y="0" width="880" height="590" rx="14" fill="#0B2530" stroke="#174D63" stroke-width="1.5" />
  <rect x="1" y="1" width="878" height="588" rx="13" fill="url(#waterGlow)" />

  <!-- Animated Ambient Water Currents (Background Layer) -->
  <g class="ambient-pulse" opacity="0.45">
    <path class="wave-1" d="M-100,160 Q150,130 400,160 T900,150 T1400,170" fill="none" stroke="url(#waveGradient)" stroke-width="1.8" />
    <path class="wave-2" d="M-50,340 Q200,370 450,335 T950,355 T1450,330" fill="none" stroke="url(#waveGradient)" stroke-width="1.5" />
    <path class="wave-1" d="M-80,480 Q180,455 420,485 T920,470 T1420,490" fill="none" stroke="url(#waveGradient)" stroke-width="1.5" />
  </g>

  <!-- Terminal Header Bar -->
  <path d="M0,14 C0,6.27 6.27,0 14,0 L866,0 C873.73,0 880,6.27 880,14 L880,38 L0,38 Z" fill="#061820" />
  <line x1="0" y1="38" x2="880" y2="38" stroke="#174D63" stroke-width="1.2" />

  <!-- Window Controls (Feng Shui Elements: Water & Wood Tones) -->
  <circle cx="28" cy="19" r="6" fill="#174D63" />
  <circle cx="48" cy="19" r="6" fill="#38BFA7" />
  <circle cx="68" cy="19" r="6" fill="#A8E6CF" />

  <!-- Centered Title -->
  <text x="440" y="24" text-anchor="middle" class="mono title-text">
    ocean-terminal ~ /dev/abyss · 2003 Quý Mùi (Dương Liễu Mộc 🌿)
  </text>

  <!-- Terminal Body Content -->
  <g transform="translate(32, 28)">

    <!-- Command 1: whoami -->
    <text x="0" y="42" class="mono prompt">ocean@developer:~$</text>
    <text x="175" y="42" class="mono cmd">whoami --fengshui</text>

    <text x="16" y="66" class="mono text-dim">❯</text>
    <text x="36" y="66" class="mono text-primary"><tspan fill="#38BFA7" font-weight="600">Minh Nghĩa (Nghiamh)</tspan> — Mobile &amp; Fullstack Web Engineer</text>
    
    <text x="16" y="88" class="mono text-dim">❯</text>
    <text x="36" y="88" class="mono text-primary">Nạp Âm: <tspan fill="#A8E6CF">Dương Liễu Mộc</tspan> · Tương Sinh: <tspan fill="#38BFA7">Thủy Dưỡng Mộc (Deep Ocean nourishing Willow Wood)</tspan></text>

    <!-- Command 2: featured projects -->
    <text x="0" y="126" class="mono prompt">ocean@developer:~$</text>
    <text x="175" y="126" class="mono cmd">ls -la /ecosystem/featured-projects</text>

    <g transform="translate(16, 150)">
      <!-- Project 1 -->
      <text x="0" y="0" class="mono text-teal" font-weight="600">[01] ArenaS-Platform</text>
      <text x="195" y="0" class="mono text-dim">::</text>
      <text x="215" y="0" class="mono text-primary">Sports Arena Booking Ecosystem (Monorepo: BE + Web + Mobile)</text>
      <text x="36" y="20" class="mono text-dim">└─ Core:</text>
      <text x="105" y="20" class="mono text-teal">React Native · Expo · React.js · Node.js · Express · MySQL</text>

      <!-- Project 2 -->
      <text x="0" y="50" class="mono text-teal" font-weight="600">[02] Emergency-Dispatch</text>
      <text x="195" y="50" class="mono text-dim">::</text>
      <text x="215" y="50" class="mono text-primary">Real-time Emergency Response &amp; Fleet Dispatch Management</text>
      <text x="36" y="70" class="mono text-dim">└─ Core:</text>
      <text x="105" y="70" class="mono text-teal">React 19 · TypeScript · SignalR · Mapbox GL · TailwindCSS</text>
    </g>

    <!-- Command 3: tech stack -->
    <text x="0" y="258" class="mono prompt">ocean@developer:~$</text>
    <text x="175" y="258" class="mono cmd">cat /proc/skills/stack</text>

    <g transform="translate(16, 282)">
      <text x="0" y="0" class="mono text-dim">❯</text>
      <text x="20" y="0" class="mono text-teal" font-weight="600">Mobile &amp; Web :</text>
      <text x="155" y="0" class="mono text-primary">React Native, Expo, React.js, TailwindCSS, HTML5, CSS3</text>

      <text x="0" y="22" class="mono text-dim">❯</text>
      <text x="20" y="22" class="mono text-teal" font-weight="600">Backend &amp; DB :</text>
      <text x="155" y="22" class="mono text-primary">Node.js, Express.js, TypeScript, MySQL, RESTful APIs, SignalR</text>

      <text x="0" y="44" class="mono text-dim">❯</text>
      <text x="20" y="44" class="mono text-teal" font-weight="600">Tools &amp; Arch :</text>
      <text x="155" y="44" class="mono text-primary">Git, GitHub, Postman, Vite, Monorepo Architecture</text>
    </g>

    <!-- Command 4: philosophy / motto -->
    <text x="0" y="364" class="mono prompt">ocean@developer:~$</text>
    <text x="175" y="364" class="mono cmd">echo $OCEAN_MOTTO</text>

    <text x="16" y="388" class="mono text-teal" font-style="italic">
      "Mềm mại như cành dương liễu đón gió, vững chãi và sâu lắng như mạch nước đại dương."
    </text>

    <!-- Active Prompt with Blinking Cursor -->
    <text x="0" y="426" class="mono prompt">ocean@developer:~$</text>
    <rect class="cursor" x="180" y="413" width="9" height="16" fill="#38BFA7" />

  </g>

  <!-- Ocean-inspired Status Bar at Bottom -->
  <g transform="translate(0, 546)">
    <path d="M0,0 L880,0 L880,30 C880,37.73 873.73,44 866,44 L14,44 C6.27,44 0,37.73 0,30 Z" fill="#061820" />
    <line x1="0" y1="0" x2="880" y2="0" stroke="#174D63" stroke-width="1.2" />

    <!-- Left indicators -->
    <text x="24" y="27" class="mono status-text" fill="#174D63">
      DEPTH: <tspan fill="#38BFA7">2003m</tspan>
    </text>
    <text x="145" y="27" class="mono status-text" fill="#174D63">
      ELEMENT: <tspan fill="#A8E6CF">YANG WILLOW WOOD</tspan>
    </text>
    <text x="375" y="27" class="mono status-text" fill="#174D63">
      TIDE: <tspan class="tide-indicator">RISING HIGH 🌊</tspan>
    </text>

    <!-- Right status -->
    <circle cx="678" cy="23" r="4.5" fill="#38BFA7" filter="url(#aquaGlow)" />
    <text x="692" y="27" class="mono status-text" fill="#A8E6CF">
      STATUS: OPEN FOR OPPORTUNITIES
    </text>
  </g>
</svg>
